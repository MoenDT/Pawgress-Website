
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="loginpage">
    <h2>Create New Password</h2>

    <p>Enter and confirm your new password.</p>
    <p>Your account password will not be changed.</p>

    <form onsubmit="changePassword(event)"
        style="display:flex; flex-direction:column; align-items:center;">

        <div class="password">
            <input type="password" id="newPassword"
                placeholder="New Password" minlength="8" required>

            <button type="button" class="clearbutton"
                onclick="document.getElementById('newPassword').value = ''">
                <img src="crossouticon.png" alt="Clear password" width="50px">
            </button>
        </div>

        <div class="password">
            <input type="password" id="confirmPassword"
                placeholder="Confirm Password" minlength="8" required>

            <button type="button" class="clearbutton"
                onclick="document.getElementById('confirmPassword').value = ''">
                <img src="crossouticon.png" alt="Clear password" width="50px">
            </button>
        </div>

        <button type="submit" class="confirmbutton">
            Reset Password
        </button>
    </form>

    <a class="loginlink" href="resetpasswordpage.html">Back</a>
    <a class="loginlink" href="loginpage.html">Login Screen</a>

    <script>
        function changePassword(event) {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match. Please try again.");
                return;
            }

            alert("Demo: Password validation successful!");
            window.location.href = "loginpage.html";
        }
    </script>
</body>
</html>
