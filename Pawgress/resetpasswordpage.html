<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Reset Password Page</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
    </head>
    <body class="loginpage">
            <h2>Reset Password</h2>

            <p>Please enter your email address. More information will be sent to reset your password.</p>
            <div class="email">
                <input type="email" id="email" name="email" placeholder="Email Address" required>
                <button type="button" class="clearbutton" onclick="clearInput('email')">
                    <img src="crossouticon.png" alt="Clear email" width="50px">
                </button>
            </div>

            <button class="confirmbutton" onclick="window.location.href='dashboardpage.html'">Login</button>
            
            <a class="loginlink" href="createaccountpage.html">Create Account</a>
            <a class="loginlink" href="loginpage.html">Login Screen</a>
    </body>
    </html>
