
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="loginpage">
    <h2>Reset Password</h2>

    <p>Please enter your email address to reset your password.</p>

    <form onsubmit="resetPassword(event)"
          style="display:flex; flex-direction:column; align-items:center;">

        <div class="email">
            <input type="email" id="email" name="email"
                placeholder="Email Address" required>

            <button type="button" class="clearbutton"
                onclick="document.getElementById('email').value = ''">
                <img src="crossouticon.png" alt="Clear email" width="50px">
            </button>
        </div>

        <button type="submit" class="confirmbutton">
            Send Reset Link
        </button>
    </form>

    <a class="loginlink" href="createaccountpage.html">Create Account</a>
    <a class="loginlink" href="loginpage.html">Login Screen</a>

    <script>
        function resetPassword(event) {
            event.preventDefault();
            alert("Demo: Email validated successfully.");
            window.location.href = "newpasswordpage.html";
        }
    </script>
</body>
</html>
