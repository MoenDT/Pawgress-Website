<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login Page</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js"></script>
    </head>
    <body class="loginpage">
            <h3>Pawgress</h3>

            <div class="username">
                <input type="text" id="username" name="username" placeholder="Username" required>
                <button type="button" class="clearbutton" onclick="clearInput('username')">
                    <img src="crossouticon.png" alt="Clear username" width="50px">
                </button>
            </div>

            <div class="password">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="button" class="clearbutton" onclick="clearInput('password')">
                    <img src="crossouticon.png" alt="Clear username" width="50px">
                </button>
            </div>

            <button class="confirmbutton" onclick="window.location.href='dashboardpage.html'">Login</button>
            
            <a class="loginlink" href="createaccountpage.html">Create Account</a>
            <a class="loginlink" href="resetpasswordpage.html">Forgot Password</a>
    </body>
    </html>
