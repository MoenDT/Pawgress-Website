        <section>
            <h1>Add Vet Visit</h1>
            <p>Enter your pet's vet visit information here.</p>

            <form class="addform">
                <label for="petname">Pet Name</label>
                <input type="text" id="petname" name="petname" required>
                <label for="visitdate">Visit Date</label>
                <input type="text" id="visitdate" name="visitdate" required>
                <label for="vet">Veterinarian</label>
                <input type="text" id="vet" name="vet" required>
                <label for="reason">Reason</label>
                <input type="text" id="reason" name="reason" required>
                <label for="status">Status</label>
                <input type="text" id="status" name="status" required>
            <button class="confirmbutton">Add Visit</button>
            </form>  
        </section>
