        <section>
            <h1>Add Medication</h1>
            <p>Enter your pet's medication information here.</p>

            <form class="addform">
                <label for="petname">Pet Name</label>
                <input type="text" id="petname" name="petname" required>
                <label for="medname">Medication Name</label>
                <input type="text" id="medname" name="medname" required>
                <label for="dosage">Dosage</label>
                <input type="text" id="dosage" name="dosage" required>
                <label for="instructions">Instructions</label>
                <input type="text" id="instructions" name="instructions" required>
                <label for="duration">Duration</label>
                <input type="text" id="duration" name="duration" required>
            <button class="confirmbutton">Add Medication</button>
            </form>  
        </section>
